[package]
name = "bmc-drivers"
version = "0.1.0"
description = "Compiled BMC operation drivers and selection rules"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
bmc-platform = { path = "../bmc-platform" }
bmc-runtime = { path = "../bmc-runtime" }
hex = { workspace = true }
nv-redfish = { features = [
    "accounts",
    "bios",
    "boot-options",
    "chassis",
    "computer-systems",
    "ethernet-interfaces",
    "host-interfaces",
    "manager-network-protocol",
    "managers",
    "oem-ami",
    "oem-delta",
    "oem-dell-attributes",
    "oem-hpe",
    "oem-lenovo",
    "oem-nvidia",
    "oem-supermicro",
    "power-equipment",
    "power-supplies",
    "secure-boot",
    "storages",
    "update-service",
], workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bmc-mock = { path = "../bmc-mock" }
carbide-test-support = { path = "../test-support" }
tokio = { features = ["macros", "rt"], workspace = true }

[lints]
workspace = true
